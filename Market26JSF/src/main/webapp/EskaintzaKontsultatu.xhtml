<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html"
	xmlns:f="jakarta.faces.core">
<f:view>
	<h:head>
		<title>Eskaintzak kontsultatu</title>
	</h:head>
	<h:body>
		<h1>Eskaintzak kontsultatu</h1>

		<h:form id="kontsultaForm">
			<p>
				<h:inputText id="bilaketa" value="#{querySalesBean.bilaketa}" />
				<h:commandButton value="Bilatu" action="#{querySalesBean.bilatu}" />
			</p>

			<h:outputText value="#{querySalesBean.mezua}" style="color:red" />

			<h:dataTable id="taula" value="#{querySalesBean.salmentak}"
				var="item" border="1">
				<f:facet name="header">Produktuak</f:facet>

				<h:column>
					<f:facet name="header">Izenburua</f:facet>
					#{item.title}
				</h:column>
				<h:column>
					<f:facet name="header">Prezioa</f:facet>
					#{item.price}
				</h:column>
				<h:column>
					<f:facet name="header">Argitaratze data</f:facet>
					<h:outputText value="#{item.publicationDate}">
						<f:convertDateTime pattern="dd-MM-yyyy" />
					</h:outputText>
				</h:column>
				<h:column>
					<f:facet name="header"></f:facet>
					<h:commandButton value="Ikusi"
						action="#{querySalesBean.ikusi(item)}" />
				</h:column>
			</h:dataTable>

			<p>
				<h:button value="Itxi" outcome="Hasiera" />
			</p>
		</h:form>
	</h:body>
</f:view>
</html>
